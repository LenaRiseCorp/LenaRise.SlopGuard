# LenaRise.SlopGuard — semgrep rules
#
# GENERATED FILE. Do not edit; the source is lib/patterns.mjs.
# To regenerate: npm run docs
#
# This file works independently of Claude Code: any CI with semgrep can use it.
# The coverage is deliberately narrower — path and command scope patterns (the
# test-file lock, destructive commands, package verification) cannot be expressed
# as a static scanner, so they stay in the hook and git layers.

rules:
  - id: slopguard-code-04-guard-and-go
    languages: [generic]
    severity: WARNING
    message: >-
      CODE-04 Code parked on a dead branch — wrapped instead of deleted. Fix: Delete it. If you need it back, it is in the git history.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "\\bif\\s*\\(\\s*(?:false|0)\\s*\\)|\\bif\\s+False\\s*:"
  - id: slopguard-code-05-empty-catch
    languages: [generic]
    severity: ERROR
    message: >-
      CODE-05 Empty catch body — the error is caught and swallowed. Fix: Log it, rethrow it, or handle it explicitly.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "\\bcatch\\s*(?:\\([^)]*\\))?\\s*\\{\\s*\\}"
  - id: slopguard-code-05-comment-only-catch
    languages: [generic]
    severity: ERROR
    message: >-
      CODE-05 Catch body containing only comments — the error is still swallowed. Fix: Log it or rethrow it. A justification comment is not error handling.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "\\bcatch\\s*(?:\\([^)]*\\))?\\s*\\{\\s*(?:\\/\\/[^\\n]*\\s*|\\/\\*(?:[^*]|\\*(?!\\/)){0,400}\\*\\/\\s*)+\\}"
  - id: slopguard-code-05-except-pass
    languages: [generic]
    severity: ERROR
    message: >-
      CODE-05 except: pass — the exception is silently swallowed. Fix: Log it or rethrow it.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "^[ \\t]*except\\b[^\\n:]*:[ \\t]*(?:\\n[ \\t]+)?pass[ \\t]*$"
  - id: slopguard-code-05-catch-noop
    languages: [generic]
    severity: ERROR
    message: >-
      CODE-05 Empty .catch() — the rejected promise is silently swallowed. Fix: Log it or propagate it.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "\\.catch\\(\\s*(?:\\([^)]*\\)|[A-Za-z_$][\\w$]*)\\s*=>\\s*\\{\\s*\\}\\s*\\)"
  - id: slopguard-test-04-tautological-assert
    languages: [generic]
    severity: ERROR
    message: >-
      TEST-04 An assertion that passes under every condition — it verifies nothing. Fix: Assert the real behaviour, or delete the test.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "\\bassert\\s+True\\b|\\bassert\\s*\\(\\s*(?:true|True|1)\\s*\\)|expect\\(\\s*true\\s*\\)\\s*\\.\\s*toBe\\(\\s*true\\s*\\)|assert\\.ok\\(\\s*true\\s*\\)"
  - id: slopguard-test-01-skipped-test
    languages: [generic]
    severity: ERROR
    message: >-
      TEST-01 A skipped test — the shortest route from red to green. Fix: Fix the test, or write down why it is skipped.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "\\b(?:it|test|describe|context)\\s*\\.\\s*skip\\s*\\(|\\bx(?:it|describe)\\s*\\(|@pytest\\.mark\\.skip|\\bt\\.Skip\\("
  - id: slopguard-test-03-fake-impl
    languages: [generic]
    severity: WARNING
    message: >-
      TEST-03 Fake implementation — a signature with no body. Fix: Write the body, or do not add the function yet.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "(?i)\\braise\\s+NotImplementedError\\b|throw\\s+new\\s+\\w*Error\\(\\s*['\"`]Not implemented"
  - id: slopguard-sec-03-inline-secret
    languages: [generic]
    severity: ERROR
    message: >-
      SEC-03 Secret committed to source. Fix: Move it to an environment variable; rotate it if it leaked.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "(?i)\\b(?:(?:api|access|secret|auth|private|encryption|refresh)[_-]?(?:key|token|secret)|api[_-]?key|secret|token|password|passwd)\\s*[:=]\\s*['\"][A-Za-z0-9_\\-./+]{16,}['\"]"
  - id: slopguard-sec-03-aws-key
    languages: [generic]
    severity: ERROR
    message: >-
      SEC-03 AWS access key ID. Fix: Revoke the key now and move it to an environment variable.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "\\bAKIA[0-9A-Z]{16}\\b"
  - id: slopguard-sec-03-private-key
    languages: [generic]
    severity: ERROR
    message: >-
      SEC-03 Private key embedded in a file. Fix: Remove it from the file, move it to a secret store, rotate it.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "-----BEGIN (?:[A-Z ]+ )?PRIVATE KEY-----"
  - id: slopguard-sec-05-sql-concat
    languages: [generic]
    severity: ERROR
    message: >-
      SEC-05 SQL built by string concatenation — an injection surface. Fix: Use a parameterised query.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "(?i)\\b(?:SELECT|INSERT\\s+INTO|UPDATE|DELETE\\s+FROM)\\b[^\\n;'\"]{0,120}['\"]\\s*(?:\\+|\\.|%)\\s*[A-Za-z_$]"
  - id: slopguard-sec-05-sql-fstring
    languages: [generic]
    severity: ERROR
    message: >-
      SEC-05 SQL built with an f-string — an injection surface. Fix: Use a parameterised query.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "(?i)f['\"][^'\"\\n]*\\b(?:SELECT|INSERT\\s+INTO|UPDATE|DELETE\\s+FROM)\\b[^'\"\\n]*\\{"
  - id: slopguard-sec-01-eval
    languages: [generic]
    severity: ERROR
    message: >-
      SEC-01 Dynamic code execution. Fix: Parse the data, do not execute it. Use JSON.parse for JSON.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "(?<![.\\w])eval\\s*\\(|(?<![.\\w])exec\\s*\\(\\s*[A-Za-z_$][\\w$]*\\s*[,)]"
  - id: slopguard-doc-04-emoji-heading
    languages: [generic]
    severity: WARNING
    message: >-
      DOC-04 Heading that opens with an emoji. Fix: Write the heading in words.
    paths:
      include:
      - "*.md"
      - "*.mdx"
      - "*.markdown"
      - "*.txt"
      - "*.rst"
      - "*.adoc"
    patterns:
      - pattern-regex: "^#{1,6}\\s+\\p{Extended_Pictographic}"
  - id: slopguard-doc-01-buzzword
    languages: [generic]
    severity: WARNING
    message: >-
      DOC-01 Marketing language carrying no information. Fix: Say concretely what it does.
    paths:
      include:
      - "*.md"
      - "*.mdx"
      - "*.markdown"
      - "*.txt"
      - "*.rst"
      - "*.adoc"
    patterns:
      - pattern-regex: "(?i)\\b(?:robust and flexible|seamlessly|cutting[- ]edge|state[- ]of[- ]the[- ]art|leverage the power|güçlü ve esnek|sorunsuzca entegre)\\b"
  - id: slopguard-proc-08-effort-estimate
    languages: [generic]
    severity: ERROR
    message: >-
      PROC-08 A time estimate that cannot be measured. Fix: Express scope as files, steps and unknowns instead.
    paths:
      include:
      - "*.md"
      - "*.mdx"
      - "*.markdown"
      - "*.txt"
      - "*.rst"
      - "*.adoc"
    patterns:
      - pattern-regex: "(?i)\\b(?:tahmin\\w*|yaklaşık|ETA|estimated?|estimates?|roughly|about)\\b[^\\n]{0,40}\\b\\d+[-–]?\\d*\\s*(?:saat|gün|hafta|ay\\b|hours?|days?|weeks?|months?)|\\b\\d+[-–]?\\d*\\s*(?:saat|gün|hafta|hours?|days?|weeks?)\\b[^\\n]{0,25}\\b(?:sürer|sürecek|sürüyor|alır|alacak|alıyor|takes|will take)\\b"
  - id: slopguard-game-01-framerate-dependent-motion
    languages: [generic]
    severity: WARNING
    message: >-
      GAME-01 Motion is frame-rate dependent — not scaled by Time.deltaTime. Fix: Multiply by Time.deltaTime; otherwise the game runs at different speeds at 30 and 144 fps.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "\\btransform\\.Translate\\s*\\((?![^)]*\\bTime\\.)[^)]*\\)|\\btransform\\.position\\s*\\+=\\s*(?![^;\\n]*\\bTime\\.)[^;\\n]*[*][^;\\n]*;"
  - id: slopguard-game-02-scene-lookup-per-frame
    languages: [generic]
    severity: WARNING
    message: >-
      GAME-02 Scene lookup or component resolution inside the frame loop. Fix: Resolve the reference once in Awake and store it, or wire it with [SerializeField].
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "(?:^|\\s)(?:private\\s+|public\\s+|protected\\s+)?void\\s+(?:Update|LateUpdate)\\s*\\(\\s*\\)\\s*\\{(?:(?!\\b(?:void|IEnumerator)\\s+\\w+\\s*\\()[\\s\\S]){0,500}?\\b(?:GameObject\\.Find\\w*\\s*\\(|Object\\.FindObjectOfType|FindObjectOfType\\s*<|FindFirstObjectByType\\s*<|Camera\\.main\\b|GetComponent\\s*<)"
  - id: slopguard-game-03-physics-in-update
    languages: [generic]
    severity: WARNING
    message: >-
      GAME-03 Physics call inside Update — not synchronised with the physics step. Fix: Move Rigidbody work into FixedUpdate.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "(?:^|\\s)(?:private\\s+|public\\s+|protected\\s+)?void\\s+(?:Update|LateUpdate)\\s*\\(\\s*\\)\\s*\\{(?:(?!\\b(?:void|IEnumerator)\\s+\\w+\\s*\\()[\\s\\S]){0,500}?(?:\\b(?:AddForce|AddRelativeForce|AddTorque|MovePosition|MoveRotation)\\s*\\(|\\.velocity\\s*=[^=])"
  - id: slopguard-game-04-hot-path-allocation
    languages: [generic]
    severity: WARNING
    message: >-
      GAME-04 LINQ inside the frame loop — garbage every frame, visible as hitching. Fix: Precompute the result or write the loop by hand; do not allocate on the hot path.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
      - "*.cjs"
      - "*.ts"
      - "*.tsx"
      - "*.mts"
      - "*.cts"
      - "*.py"
      - "*.rb"
      - "*.go"
      - "*.rs"
      - "*.java"
      - "*.kt"
      - "*.swift"
      - "*.cs"
      - "*.php"
      - "*.c"
      - "*.h"
      - "*.cc"
      - "*.cpp"
      - "*.hpp"
      - "*.scala"
      - "*.sh"
      - "*.bash"
      - "*.zsh"
      - "*.sql"
      - "*.vue"
      - "*.svelte"
      - "*.gd"
    patterns:
      - pattern-regex: "(?:^|\\s)(?:private\\s+|public\\s+|protected\\s+)?void\\s+(?:Update|LateUpdate)\\s*\\(\\s*\\)\\s*\\{(?:(?!\\b(?:void|IEnumerator)\\s+\\w+\\s*\\()[\\s\\S]){0,500}?\\.(?:Where|Select|OrderBy|OrderByDescending|ToList|ToArray|FirstOrDefault)\\s*\\("
  - id: slopguard-game-05-logging-per-frame
    languages: [generic]
    severity: WARNING
    message: >-
      GAME-05 Logging every frame — measurably lowers frame time in the editor. Fix: Remove it, or gate it behind a condition or #if UNITY_EDITOR.
    paths:
      include:
      - "*.js"
      - "*.jsx"
      - "*.mjs"
