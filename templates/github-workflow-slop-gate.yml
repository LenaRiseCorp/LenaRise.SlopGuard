name: slop-gate

# LenaRise.SlopGuard — installed by /slop-repo-init.
# A later /slop-repo-init refreshes this file; edit it and it will be overwritten.
# Rename the file (or delete the line above) to take it over yourself.
#
# The repository layer: whichever agent wrote the code, it stops here.
# Claude Code hooks covered only Claude Code; this workflow covers everyone.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  pattern-scan:
    name: Pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The scanner lives in its own repository, which is public, so the
      # runner's built-in GITHUB_TOKEN reads it and no secret is needed.
      # SLOPGUARD_TOKEN stays in the expression for the other case: a private
      # fork of the scanner, where GITHUB_TOKEN is scoped to the repository
      # being built and cannot reach a private sibling.
      - name: Fetch the LenaRise.SlopGuard scanner
        id: fetch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: LenaRiseCorp/LenaRise.SlopGuard
          token: ${{ secrets.SLOPGUARD_TOKEN || github.token }}
          path: .slopguard-tool
          persist-credentials: false

      # A failed fetch must say what to do. Left to itself the checkout reports
      # "repository not found", which is what a private repository looks like to
      # an unauthorised caller and sends the reader hunting for the wrong bug.
      - name: Explain a failed fetch
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error title=SlopGuard scanner could not be fetched::LenaRiseCorp/LenaRise.SlopGuard could not be read. It is public, so this usually means a network or outage problem — or you are pointing at a private fork."
          echo "The pattern scan needs read access to the scanner repository."
          echo
          echo "If you are using a PRIVATE fork of the scanner, it needs a read token:"
          echo "  1. Create a fine-grained personal access token with Contents: read"
          echo "     on LenaRiseCorp/LenaRise.SlopGuard."
          echo "  2. Store it as a secret named SLOPGUARD_TOKEN."
          echo "     For every repository at once (needs organisation admin):"
          echo "       gh secret set SLOPGUARD_TOKEN --org LenaRiseCorp --visibility all"
          echo "     For this repository only:"
          echo "       gh secret set SLOPGUARD_TOKEN --repo ${{ github.repository }}"
          echo
          echo "If SLOPGUARD_TOKEN is already set, the token has expired or lost"
          echo "Contents: read on the scanner repository. A fine-grained token also"
          echo "has to be approved by the organisation before it works."
          exit 1

      - name: Scan changed files
        run: node .slopguard-tool/scripts/scan-diff.mjs --base "${{ github.event.pull_request.base.sha || github.event.before }}"

  secret-scan:
    name: Leaked secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  duplication:
    name: Duplication (CODE-01)
    runs-on: ubuntu-latest
    # Repository-wide duplication is invisible in a diff, which is why it lives in CI.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes jscpd . --min-lines 8 --threshold 3 --reporters consoleFull
