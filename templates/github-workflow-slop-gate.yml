name: slop-gate

# LenaRise.SlopGuard — installed by /slop-repo-init.
# A later /slop-repo-init refreshes this file; edit it and it will be overwritten.
# Rename the file (or delete the line above) to take it over yourself.
#
# The repository layer: whichever agent wrote the code, it stops here.
# Claude Code hooks covered only Claude Code; this workflow covers everyone.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  pattern-scan:
    name: Pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The scanner lives in its own repository, which is public, so the
      # runner's built-in GITHUB_TOKEN reads it and no secret is needed.
      #
      # Both inputs are variables so that a private fork actually works. A token
      # alone would not have been enough: it authenticates the checkout, it does
      # not change which repository is checked out. Point SLOPGUARD_REPO at the
      # fork and SLOPGUARD_TOKEN at a token with Contents: read on it.
      - name: Fetch the LenaRise.SlopGuard scanner
        id: fetch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SLOPGUARD_REPO || 'LenaRiseCorp/LenaRise.SlopGuard' }}
          token: ${{ secrets.SLOPGUARD_TOKEN || github.token }}
          path: .slopguard-tool
          persist-credentials: false

      # A failed fetch must say what to do. Left to itself the checkout reports
      # "repository not found", which is what a private repository looks like to
      # an unauthorised caller and sends the reader hunting for the wrong bug.
      - name: Explain a failed fetch
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error title=SlopGuard scanner could not be fetched::${{ vars.SLOPGUARD_REPO || 'LenaRiseCorp/LenaRise.SlopGuard' }} could not be read."
          echo "The pattern scan needs read access to the scanner repository."
          echo
          echo "The upstream scanner is public, so this is normally a network or"
          echo "outage problem and a re-run fixes it."
          echo
          echo "If you point SLOPGUARD_REPO at a PRIVATE fork, it also needs a token:"
          echo "  1. Create a fine-grained token with Contents: read on that fork."
          echo "  2. gh variable set SLOPGUARD_REPO --body '<owner>/<fork>' --org <org>"
          echo "  3. gh secret set SLOPGUARD_TOKEN --org <org> --visibility all"
          echo "     (or --repo ${{ github.repository }} for this repository alone)"
          echo
          echo "A token alone is not enough: it authenticates the checkout, it does"
          echo "not change which repository is checked out. Set both, or neither."
          echo
          echo "A fine-grained token must also be approved by the organisation."
          exit 1

      - name: Scan changed files
        run: node .slopguard-tool/scripts/scan-diff.mjs --base "${{ github.event.pull_request.base.sha || github.event.before }}"

  secret-scan:
    name: Leaked secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks CLI is MIT-licensed and free. Its GitHub Action wrapper is
      # not: on an organisation account it stops with "missing gitleaks license"
      # and the job goes red for a billing reason rather than a security one.
      # A gate that is permanently red teaches people to ignore the gate, so the
      # binary is used directly.
      #
      # To bump: read the version from the gitleaks releases page and edit here.
      # For a false positive, record its fingerprint in .gitleaksignore at the
      # repository root — never widen the scan to make it pass.
      - name: Leaked secret scan
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  duplication:
    name: Duplication (CODE-01)
    runs-on: ubuntu-latest
    # Repository-wide duplication is invisible in a diff, which is why it lives in CI.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes jscpd . --min-lines 8 --threshold 3 --reporters consoleFull
